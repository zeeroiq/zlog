services:
  zlog:
    image: zlog:${ZLOG_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ZLOG_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      zlog:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ZLOG_DOMAIN: ${ZLOG_DOMAIN:?Set ZLOG_DOMAIN in /opt/zlog/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  setup-owner:
    image: zlog:${ZLOG_IMAGE_TAG:-latest}
    profiles:
      - setup
    environment:
      NODE_ENV: production
      ZLOG_DATA_DIR: /app/data
      ZLOG_OWNER_EMAIL: ${ZLOG_OWNER_EMAIL:-}
      ZLOG_OWNER_PASSWORD: ${ZLOG_OWNER_PASSWORD:-}
    volumes:
      - ./data:/app/data
    entrypoint:
      - node
      - src/setup-owner.js

volumes:
  caddy_data:
  caddy_config:
