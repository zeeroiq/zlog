name: CI and deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: zlog-production
      cancel-in-progress: false
    env:
      PLATFORM: ${{ vars.PLATFORM || 'linux/amd64' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build deployment image
        run: |
          case "$PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo "PLATFORM must be linux/amd64 or linux/arm64" >&2; exit 1 ;;
          esac
          docker buildx build \
            --platform "$PLATFORM" \
            --tag "zlog:$GITHUB_SHA" \
            --tag zlog:latest \
            --output type=docker,dest=zlog-image.tar \
            .
          gzip -1 zlog-image.tar
      - name: Configure SSH
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "Set the HOST Actions secret" >&2; exit 1; }
          test -n "$SSH_USER" || { echo "Set the SSH_USER Actions secret" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Set the SSH_PRIVATE_KEY Actions secret" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Set the KNOWN_HOSTS Actions secret" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Install transfer progress tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pv

      - name: Upload Compose configuration
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Uploading compose.yaml to $HOST..."
          scp -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            compose.yaml \
            "$SSH_USER@$HOST:/opt/zlog/compose.yaml.$GITHUB_SHA"

      - name: Upload Caddy configuration
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Uploading Caddyfile to $HOST..."
          scp -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            Caddyfile \
            "$SSH_USER@$HOST:/opt/zlog/Caddyfile.$GITHUB_SHA"

      - name: Upload deployment image
        timeout-minutes: 30
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Uploading deployment image ($(du -h zlog-image.tar.gz | cut -f1)) to $HOST:"
          pv --force --progress --timer --eta --rate --bytes zlog-image.tar.gz | ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$SSH_USER@$HOST" \
            "cat > /opt/zlog/zlog-image-$GITHUB_SHA.tar.gz"

      - name: Deploy and wait for health check
        timeout-minutes: 10
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Starting remote deployment on $HOST..."
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$SSH_USER@$HOST" \
            "sh -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          release=$1
          cd /opt/zlog
          trap 'rm -f "/opt/zlog/zlog-image-$release.tar.gz" "/opt/zlog/compose.yaml.$release" "/opt/zlog/Caddyfile.$release" "/opt/zlog/.compose.yaml.$release.previous" "/opt/zlog/.Caddyfile.$release.previous"' EXIT
          previous_release=
          if [ -f .zlog-image-tag ]; then
            previous_release=$(cat .zlog-image-tag)
          fi
          echo "Loading deployment image..."
          docker load -i "zlog-image-$release.tar.gz"
          echo "Deployment image loaded; updating Compose configuration..."
          if [ -f compose.yaml ]; then
            cp compose.yaml ".compose.yaml.$release.previous"
          fi
          if [ -f Caddyfile ]; then
            cp Caddyfile ".Caddyfile.$release.previous"
          fi
          mv "compose.yaml.$release" compose.yaml
          mv "Caddyfile.$release" Caddyfile
          printf '%s\n' "$release" > .zlog-image-tag.next
          mv .zlog-image-tag.next .zlog-image-tag
          echo "Starting services and waiting up to 120 seconds for health checks..."
          if ! ZLOG_IMAGE_TAG="$release" docker compose up -d --wait --wait-timeout 120; then
            echo "Deployment health check failed; restoring previous release..."
            if [ -n "$previous_release" ]; then
              printf '%s\n' "$previous_release" > .zlog-image-tag
            else
              rm -f .zlog-image-tag
            fi
            if [ -f ".compose.yaml.$release.previous" ]; then
              mv ".compose.yaml.$release.previous" compose.yaml
            else
              rm -f compose.yaml
            fi
            if [ -f ".Caddyfile.$release.previous" ]; then
              mv ".Caddyfile.$release.previous" Caddyfile
            else
              rm -f Caddyfile
            fi
            if [ -n "$previous_release" ] && ! ZLOG_IMAGE_TAG="$previous_release" docker compose up -d --wait --wait-timeout 120; then
              echo "Deployment and rollback both failed; inspect the OCI instance." >&2
            fi
            exit 1
          fi
          rm -f ".compose.yaml.$release.previous" ".Caddyfile.$release.previous"
          echo "Deployment is healthy."
          REMOTE
