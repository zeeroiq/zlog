name: CI and deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: zlog-production
      cancel-in-progress: false
    env:
      PLATFORM: ${{ vars.PLATFORM || 'linux/amd64' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Package deployment release
        run: |
          case "$PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo "PLATFORM must be linux/amd64 or linux/arm64" >&2; exit 1 ;;
          esac
          docker buildx build \
            --platform "$PLATFORM" \
            --target release-artifact \
            --output type=local,dest=release \
            .
          tar -C release -czf zlog-release.tar.gz .
      - name: Configure SSH
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "Set the HOST Actions secret" >&2; exit 1; }
          test -n "$SSH_USER" || { echo "Set the SSH_USER Actions secret" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Set the SSH_PRIVATE_KEY Actions secret" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Set the KNOWN_HOSTS Actions secret" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload Compose configuration
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Uploading compose.yaml to $HOST..."
          scp -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            compose.yaml \
            "$SSH_USER@$HOST:/opt/zlog/compose.yaml.$GITHUB_SHA"

      - name: Upload Caddy configuration
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Uploading Caddyfile to $HOST..."
          scp -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            Caddyfile \
            "$SSH_USER@$HOST:/opt/zlog/Caddyfile.$GITHUB_SHA"

      - name: Upload deployment release
        timeout-minutes: 90
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          release_path=zlog-release.tar.gz
          remote_path="/opt/zlog/zlog-release-$GITHUB_SHA.tar.gz"
          partial_path="$remote_path.part"
          release_size=$(stat -c '%s' "$release_path")
          release_checksum=$(sha256sum "$release_path" | cut -d ' ' -f 1)
          ssh_options=(
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          echo "Deployment release is $(du -h "$release_path" | cut -f1); SHA-256: $release_checksum"
          remote_state=$(ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "if [ -f '$remote_path' ]; then printf 'complete '; wc -c < '$remote_path'; elif [ -f '$partial_path' ]; then printf 'partial '; wc -c < '$partial_path'; else printf 'missing 0\\n'; fi")
          read -r remote_status remote_size <<< "$remote_state"
          if [[ "$remote_status" == complete ]]; then
            remote_checksum=$(ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "sha256sum '$remote_path' | cut -d ' ' -f 1")
            if [[ "$remote_size" == "$release_size" && "$remote_checksum" == "$release_checksum" ]]; then
              echo "A verified copy of this release is already on $HOST; skipping transfer."
              exit 0
            fi
            echo "Existing complete release failed size/checksum verification; restarting transfer."
            ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "rm -f '$remote_path' '$partial_path'"
            remote_status=missing
            remote_size=0
          fi
          if ! [[ "$remote_size" =~ ^[0-9]+$ ]] || (( remote_size > release_size )); then
            echo "Remote partial release has an invalid size; restarting transfer."
            ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "rm -f '$partial_path'"
            remote_size=0
          fi
          remaining_size=$((release_size - remote_size))
          echo "Uploading release to $HOST, resuming at $remote_size of $release_size bytes..."
          if (( remaining_size > 0 )); then
            tail -c "+$((remote_size + 1))" "$release_path" \
              | dd status=progress \
              | ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "cat >> '$partial_path'"
          fi
          echo "Verifying uploaded release checksum on $HOST..."
          remote_size=$(ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "wc -c < '$partial_path'")
          remote_checksum=$(ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "sha256sum '$partial_path' | cut -d ' ' -f 1")
          if [[ "$remote_size" != "$release_size" || "$remote_checksum" != "$release_checksum" ]]; then
            ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "rm -f '$partial_path'"
            echo "Uploaded release failed size or SHA-256 verification; partial file removed." >&2
            exit 1
          fi
          ssh "${ssh_options[@]}" "$SSH_USER@$HOST" "mv '$partial_path' '$remote_path'"
          echo "Release upload and checksum verification completed."

      - name: Deploy and wait for health check
        timeout-minutes: 10
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Starting remote deployment on $HOST..."
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$SSH_USER@$HOST" \
            "sh -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          release=$1
          cd /opt/zlog
          release_dir="/opt/zlog/releases/$release"
          trap 'rm -f "/opt/zlog/zlog-release-$release.tar.gz" "/opt/zlog/compose.yaml.$release" "/opt/zlog/Caddyfile.$release" "/opt/zlog/.compose.yaml.$release.previous" "/opt/zlog/.Caddyfile.$release.previous"; rm -rf "$release_dir"' EXIT
          previous_release=
          if [ -f .zlog-image-tag ]; then
            previous_release=$(cat .zlog-image-tag)
          fi
          echo "Extracting release bundle..."
          mkdir -p "$release_dir"
          tar -xzf "zlog-release-$release.tar.gz" -C "$release_dir"
          echo "Building small runtime image on the OCI instance..."
          docker build --tag "zlog:$release" "$release_dir"
          echo "Runtime image built; updating Compose configuration..."
          if [ -f compose.yaml ]; then
            cp compose.yaml ".compose.yaml.$release.previous"
          fi
          if [ -f Caddyfile ]; then
            cp Caddyfile ".Caddyfile.$release.previous"
          fi
          mv "compose.yaml.$release" compose.yaml
          mv "Caddyfile.$release" Caddyfile
          printf '%s\n' "$release" > .zlog-image-tag.next
          mv .zlog-image-tag.next .zlog-image-tag
          echo "Starting services and waiting up to 120 seconds for health checks..."
          if ! ZLOG_IMAGE_TAG="$release" docker compose up -d --wait --wait-timeout 120; then
            echo "Deployment health check failed; restoring previous release..."
            if [ -n "$previous_release" ]; then
              printf '%s\n' "$previous_release" > .zlog-image-tag
            else
              rm -f .zlog-image-tag
            fi
            if [ -f ".compose.yaml.$release.previous" ]; then
              mv ".compose.yaml.$release.previous" compose.yaml
            else
              rm -f compose.yaml
            fi
            if [ -f ".Caddyfile.$release.previous" ]; then
              mv ".Caddyfile.$release.previous" Caddyfile
            else
              rm -f Caddyfile
            fi
            if [ -n "$previous_release" ] && ! ZLOG_IMAGE_TAG="$previous_release" docker compose up -d --wait --wait-timeout 120; then
              echo "Deployment and rollback both failed; inspect the OCI instance." >&2
            fi
            exit 1
          fi
          docker tag "zlog:$release" zlog:latest
          rm -f ".compose.yaml.$release.previous" ".Caddyfile.$release.previous"
          echo "Deployment is healthy."
          REMOTE
